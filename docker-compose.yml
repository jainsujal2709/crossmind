services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: crossmind, POSTGRES_PASSWORD: crossmind, POSTGRES_DB: crossmind}
    volumes: [pg:/var/lib/postgresql/data]
  web:
    build: .
    env_file: .env
    environment: {DATABASE_URL: "postgresql://crossmind:crossmind@db:5432/crossmind"}
    ports: ["8000:8000"]
    depends_on: [db]
volumes: {pg: {}}
